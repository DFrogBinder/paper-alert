[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-alert"
version = "0.1.0"
description = "Terminal banner for temporal interference paper updates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=0.58,<1.0"]

[project.scripts]
paper-alert = "paper_alert.cli:main"
ppl = "paper_alert.cli:main"

[project.optional-dependencies]
dev = ["pytest==7.4.4"]

[tool.setuptools.packages.find]
include = ["paper_alert*"]
